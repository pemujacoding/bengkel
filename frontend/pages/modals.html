<div class="modal fade" id="customerModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="modal-title">Form Pelanggan</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="form-pelanggan" onsubmit="savePelanggan(event)">
                <div class="modal-body">
                    <input type="hidden" id="form-id">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Lengkap Customer</label>
                        <input type="text" id="form-nama" class="form-control" required placeholder="Masukkan nama sesuai KTP">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nomor Telepon aktif</label>
                        <input type="tel" id="form-telp" class="form-control" required placeholder="Contoh: 081234567xxx">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Alamat Rumah Lengkap</label>
                        <textarea id="form-alamat" class="form-control" rows="3" required placeholder="Nama jalan, nomor rumah, kota..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan Database</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="sparepartModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="sparepart-modal-title">Form Sparepart</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="form-data-sparepart" onsubmit="saveSparepart(event)">
                <div class="modal-body">
                    <input type="hidden" id="form-s-id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nama Suku Cadang (Onderdil)</label>
                            <input type="text" id="form-s-nama" class="form-control" required placeholder="Contoh: Kampas Rem Depan Vario">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Merk Pabrikan / Brand</label>
                            <input type="text" id="form-s-merk" class="form-control" placeholder="Contoh: AHM Genuine Part, Aspira">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Harga Eceran Satuan (Rupiah)</label>
                            <input type="number" id="form-s-harga" class="form-control" required min="0" placeholder="Contoh: 75000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Jumlah Ketersediaan Stok Awal</label>
                            <input type="number" id="form-s-stok" class="form-control" required min="0" placeholder="Jumlah pcs">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Kategori</label>
                            <input type="text" id="form-s-kategori" class="form-control" required min="0" placeholder="Listrik/lampu/oli dll">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">URL Tautan Gambar Produk (Opsional)</label>
                            <input type="url" id="form-s-gambar" class="form-control" placeholder="https://domain.com/gambar-produk.jpg">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Deskripsi Kegunaan / Catatan Kecocokan Mesin</label>
                            <textarea id="form-s-deskripsi" class="form-control" rows="3" placeholder="Tuliskan catatan detail kecocokan tipe kendaraan dll..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan Katalog Gudang</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="serviceFormModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">

<div class="modal fade" id="transaksiFormModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="transaksi-modal-title">Form Cetak Invoice Kasir</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>

                <div class="modal-body">
                    <input type="hidden" id="form-t-id">

                            </select>
                    </div>

    </div>

<div class="modal fade" id="sparepartServiceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title fw-bold">Pasang Sparepart ke Nota Service</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

                            <span>-- Cari Nama / Merk Sparepart --</span>
                            <span class="dropdown-toggle"></span>
                        </button>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>

                </div>

        </div>
    </div>
