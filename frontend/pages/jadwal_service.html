<div id="view-jadwal-list" class="view-panel container-fluid d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold m-0 text-dark">Jadwal Service</h2>
            <p class="text-muted m-0 small">Jadwal dan pengingat service untuk pelanggan</p>
        </div>
        <button class="btn btn-primary shadow-sm" onclick="openJadwalModal()">＋ Tambah Jadwal Service</button>
    </div>

    <div class="card shadow-sm border-light mb-4">
        <div class="card-body bg-light rounded p-3">
            <div class="input-group">
                <input type="text" id="search-jadwal" class="form-control" placeholder="Cari montir berdasarkan ID atau Nama...">
                <button class="btn btn-outline-secondary px-4" type="button" onclick="handleSearchJadwal()">Cari Jadwal</button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-light">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 10%;">ID</th>
                        <th style="width: 10%;">ID Kendaraan</th>
                        <th style="width: 30%;">Judul</th>
                        <th style="width: 15%;">Tanggal</th>
                        <th style="width: 25%;" class="text-center">Aksi Kendali</th>
                    </tr>
                </thead>
                <tbody id="list-jadwal-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="view-jadwal-detail" class="view-panel container-fluid d-none">
    <div class="mb-4">
        <button class="btn btn-sm btn-outline-secondary px-3 mb-2" onclick="switchView('jadwal-list')">← Kembali ke List</button>
        <h2 id="det-j-title" class="fw-bold text-dark m-0">Jadwal Service</h2>
    </div>

    <div class="card shadow-sm border-light" style="max-width: 600px;">
        <div class="card-header bg-dark text-white fw-semibold">Detail Jadwal</div>
        <div class="card-body">
            <table class="table table-borderless my-2">
                <tr><td class="text-muted" style="width: 30%;">ID Jadwal</td><td>: <span id="det-j-id" class="badge bg-secondary"></span></td></tr>
                <tr><td class="text-muted" style="width: 30%;">ID Kendaraan</td><td>: <span id="det-j-kendaraan" class="badge bg-secondary"></span></td></tr>
                <tr><td class="text-muted">Judul</td><td>: <strong id="det-j-judul"></strong></td></tr>
                <tr><td class="text-muted">Tanggal</td><td>: <span id="det-j-tanggal"></span></td></tr>
                <tr><td class="text-muted">Deskripsi</td><td>: <span id="det-j-deskripsi" class="text-secondary"></span></td></tr>
            </table>
        </div>
    </div>
</div>
