<div id="view-sparepart-list" class="view-panel container-fluid d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold m-0 text-dark">Katalog Suku Cadang (Spareparts)</h2>
            <p class="text-muted m-0 small">Monitoring ketersediaan stok komponen onderdil gudang</p>
        </div>
        <button class="btn btn-primary shadow-sm" onclick="openSparepartModal()">＋ Input Barang Baru</button>
    </div>

    <div class="card shadow-sm border-light mb-4">
        <div class="card-body bg-light rounded p-3">
            <div class="input-group">
                <input type="text" id="search-sparepart" class="form-control" placeholder="Cari sparepart berdasarkan ID atau Nama Barang...">
                <button class="btn btn-outline-secondary px-4" type="button" onclick="handleSearchSparepart()">Cari Barang</button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-light">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 10%;">ID</th>
                        <th style="width: 30%;">Nama Komponen</th>
                        <th style="width: 15%;">Merk/Brand</th>
                        <th style="width: 20%;">Harga Satuan</th>
                        <th style="width: 10%;" class="text-center">Sisa Stok</th>
                        <th style="width: 15%;" class="text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="list-sparepart-body">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div id="view-sparepart-detail" class="view-panel container-fluid d-none">
    <div class="mb-4">
        <button class="btn btn-sm btn-outline-secondary px-3 mb-2" onclick="switchView('sparepart-list')">← Kembali ke Katalog</button>
        <h2 id="det-s-page-title" class="fw-bold text-dark m-0">Spesifikasi Komponen</h2>
    </div>

    <div class="card shadow-sm border-light">
        <div class="row g-0">
            <div class="col-md-4 bg-light d-flex align-items-center justify-content-center p-3 border-end">
                <img id="det-s-gambar" src="" class="img-fluid rounded shadow-sm" alt="Foto Product" style="max-height: 280px; object-fit: cover;">
            </div>
            <div class="col-md-8">
                <div class="card-body p-4">
                    <span class="badge bg-secondary mb-2">ID Sparepart: #<span id="det-s-id"></span></span>
                    <h3 id="det-s-nama" class="fw-bold text-primary mb-1"></h3>
                    <p class="text-muted mb-2">Brand Pabrikan: <span id="det-s-merk" class="badge bg-light text-dark border"></span></p>                    
                    <p class="text-muted mb-3">Kategori: <span id="det-s-kategori" class="badge bg-light text-dark border"></span></p>
                    <div class="p-3 bg-light rounded mb-3 border-start border-primary border-3">
                        <div class="text-muted small">Harga Eceran Tertinggi (HET)</div>
                        <h4 id="det-s-harga" class="fw-bold text-dark my-1"></h4>
                        <div class="text-success small fw-semibold">● <span id="det-s-stok" class="text-dark"></span></div>
                    </div>

                    <h5 class="fw-semibold text-secondary mb-1" style="font-size: 1rem;">Deskripsi Kegunaan:</h5>
                    <p id="det-s-deskripsi" class="text-secondary" style="line-height: 1.6; font-size: 0.95rem;"></p>
                </div>
            </div>
        </div>
    </div>
</div>
