<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bengkel Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content p-4">
        
        <div id="pages-container"></div>

    </div>

    <div id="modals-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <script>
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    document.getElementById(elementId).innerHTML += await response.text();
                }
            } catch (err) { console.error(`Gagal memuat komponen: ${filePath}`, err); }
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`Gagal memuat script: ${src}`));
                document.body.appendChild(script);
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            // 1. Pastikan semua file HTML selesai digabungkan ke DOM
            await loadComponent('sidebar-container', 'pages/sidebar.html');
            await loadComponent('modals-container', 'pages/modals.html');

            const pagesContainer = 'pages-container';
            await loadComponent(pagesContainer, 'pages/home.html');
            await loadComponent(pagesContainer, 'pages/pelanggan.html');
            await loadComponent(pagesContainer, 'pages/mekanik.html');
            await loadComponent(pagesContainer, 'pages/sparepart.html');
            await loadComponent(pagesContainer, 'pages/riwayat_service.html');
            await loadComponent(pagesContainer, 'pages/transaksi.html');
            await loadComponent(pagesContainer, 'pages/jadwal_service.html');

            // 2. Muat semua file logika Javascript secara berurutan
            try {
                await loadScript('scripts/main.js');
                await loadScript('scripts/pelanggan.js');
                await loadScript('scripts/mekanik.js');
                await loadScript('scripts/sparepart.js');
                await loadScript('scripts/riwayat_service.js');
                await loadScript('scripts/transaksi.js');
                await loadScript('scripts/jadwal_service.js');
                // 3. EKSEKUSI UTAMA: Panggil fungsi inisialisasi setelah semua siap!
                initBengkelApp();
                
                console.log("Semua sistem dan data bengkel berhasil dinyalakan!");
            } catch (error) {
                console.error("Terjadi kegagalan pemuatan skrip:", error);
            }
        });
    </script>
</body>
</html>
