steps:
  - name: 'ubuntu'
    args: ['ls', '-R']
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/tcc-bengkel", "-f", "Dockerfile","."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/tcc-bengkel"]
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "bengkel",
        "--image",
        "gcr.io/$PROJECT_ID/tcc-bengkel",
        "--timeout",
        "1000s",
        "--port",
        "5000",
        "--region",
        "us-central1",
        "--allow-unauthenticated",
      ]
options:
  logging: CLOUD_LOGGING_ONLY